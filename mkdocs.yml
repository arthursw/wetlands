site_name: Wetlands
site_url: https://arthursw.github.io/wetlands/
repo_url: https://github.com/arthursw/wetlands
repo_name: arthursw/wetlands
theme:
  name: material
  logo: WetlandInverted.svg
  features:
    - navigation.instant
  #   - navigation.expand
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  version:
    provider: mike

nav:
  - Overview: index.md
  - Tutorials:
      - Run your first task: getting_started.md
      - Run code from your own package: tutorials/own_package.md
  - How-to guides:
      - Report progress, intermediate output, and worker logs: how-to/progress.md
      - Cancel a task: how-to/cancel_tasks.md
      - Handle execution and provisioning errors: how-to/errors.md
      - Handle timeouts: how-to/timeouts.md
      - Use Wetlands with asyncio: how-to/asyncio.md
      - Configure workers and GPUs: how-to/worker_configuration.md
      - Keep and reconnect to persistent workers: persistent_workers.md
      - Run commands and services: how-to/managed_processes.md
      - Debug a running worker: debugging.md
      - Discover, replace, and remove environments: how-to/environment_management.md
  - Concepts:
      - The Wetlands mental model: concepts/mental_model.md
      - Operations, tasks, and lifecycle states: tasks.md
      - Environment identity, reuse, and rebuilding: concepts/environment_identity.md
      - Values and NumPy ownership: shared_memory.md
      - Trusted-code security model: concepts/security.md
      - Choosing Wetlands or Appose: appose.md
  - Reference:
      - EnvironmentSpec and dependency fields: dependencies.md
      - Events and logging: logging.md
      - Injected task context: reference/task_context.md
      - Errors and failure categories: reference/errors.md
      - Supported platforms and values: reference/supported.md
      - CLI: reference/cli.md
      - Python API: reference/
  - Upgrading:
      - Upgrade within Wetlands 2: how-to/upgrade_v2.md
      - Migrate from Wetlands 1: migration_v2.md
  - Development:
      - Contributor setup and validation: developer/contributing.md
      - How it works: how_it_works.md
      - Architecture and execution protocol: developer/architecture.md
      - Transport codecs: developer/codecs.md

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_symbol_type_heading: true
            members_order: source
            summary:
              attributes: false
              functions: true
  - mike:
      alias_type: symlink
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
