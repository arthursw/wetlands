[project]
name = "wetlands"
version = "2.3.0"
description = "Create isolated Pixi environments and run Python functions without dependency conflicts."
authors = [{name = "Arthur Masson", email = "arthur.masson@inria.fr"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "typing-extensions>=4.0; python_version < '3.11'",
    "psutil>=6.1.0",
    "packaging>=24.2",
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://arthursw.github.io/wetlands/latest/"
Documentation = "https://arthursw.github.io/wetlands/latest/"
Repository = "https://github.com/arthursw/wetlands"
Issues = "https://github.com/arthursw/wetlands/issues"
Changelog = "https://github.com/arthursw/wetlands/blob/main/CHANGELOG.md"

[project.scripts]
wetlands = "wetlands.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/wetlands"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/tools",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/Wetland.png",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/site",
    "/dist",
    "/.vscode",
    "/.venv",
    "/.venv-*",
    "/.worktrees",
]

[project.optional-dependencies]
docs = [
    "mike>=2.1.3",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-include-markdown-plugin>=7.1.5",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.6.11",
    "mkdocstrings[python]>=0.29.1",
    "pygments<2.20",
]

shared-memory = [
    "numpy>=1.26; python_version < '3.14'",
    "numpy>=2.3.3; python_version >= '3.14'",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.0",
    "types-psutil>=6.1.0.20241221",
]
release = [
    "twine>=6.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real Pixi environments, worker processes, or package installs",
    "agent_integration: representative integration subset suitable for agent validation after broad changes",
    "compat: cross-Python compatibility tests, especially Python 3.9 subprocess runs",
    "manual: complete, expensive, or flaky-by-nature tests for local/manual/scheduled runs",
    "slow: non-manual tests expected to take noticeably longer than unit tests",
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
