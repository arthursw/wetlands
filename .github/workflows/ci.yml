name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  UV_VERSION: "0.11.16"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --python 3.14 --group dev
      - name: Check lockfile
        run: uv lock --check
      - name: Check source
        run: uv run --frozen ruff check
      - name: Check formatting
        run: uv run --frozen ruff format --check
      - name: Check typing
        run: uv run --frozen mypy src/wetlands

  test:
    name: Test (${{ matrix.platform }} Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --group dev --extra shared-memory
      - name: Run fast tests
        run: uv run --frozen --python ${{ matrix.python-version }} --extra shared-memory pytest tests -m "not integration and not compat and not manual"

  compat:
    name: Python 3.9 compatibility
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv-py39
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --python 3.9 --group dev --extra shared-memory
      - name: Run compatibility tests
        run: uv run --frozen --python 3.9 --extra shared-memory pytest -m compat

  real-pixi:
    name: Real Pixi (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: .venv-py314
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --python 3.14 --group dev --extra shared-memory
      - name: Run real-Pixi acceptance tests
        run: uv run --frozen --python 3.14 --extra shared-memory pytest tests/test_v2_pixi_integration.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build documentation strictly
        run: uv run --frozen --python 3.14 --extra docs --no-dev mkdocs build --strict

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install validation tools
        run: uv sync --frozen --python 3.14 --group release --no-dev
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate artifact metadata
        run: uv run --frozen --group release --no-dev twine check dist/*
      - name: Install and import wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wetlands-wheel"
          "$RUNNER_TEMP/wetlands-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wetlands-wheel/bin/python" -c "import wetlands; from wetlands import EnvironmentManager, EnvironmentSpec; assert wetlands.__version__ == '2.0.0'"
      - name: Install and import source distribution
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wetlands-sdist"
          "$RUNNER_TEMP/wetlands-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/wetlands-sdist/bin/python" -c "import wetlands; from wetlands import EnvironmentManager, EnvironmentSpec; assert wetlands.__version__ == '2.0.0'"

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [lint, test, compat, real-pixi, docs, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install documentation dependencies
        run: uv sync --frozen --python 3.14 --extra docs --no-dev
      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Fetch documentation branch
        run: git fetch origin gh-pages --depth=1
      - name: Read project version
        shell: bash
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"
      - name: Deploy documentation
        run: |
          uv run --frozen --extra docs --no-dev mike deploy --push --update-aliases "$PROJECT_VERSION" latest
          uv run --frozen --extra docs --no-dev mike set-default --push latest
